name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: [runs-on, runner=1cpu-linux-x64, 'run-id=${{ github.run_id }}']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # eMudhra CA fix; keep the floor even while the Node manifest/cache catches up.
          node-version: '^22.23.4'
          check-latest: true

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile;
          cd agent-packages;
          yarn install --frozen-lockfile;
          cd ..

      - name: Build
        run: yarn build
